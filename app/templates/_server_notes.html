{# Each set-up server's address. Expects `servers`. #}
<div class="space-y-4 text-sm" id="server-notes">
  {% for server in servers if server.external_url %}
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700">
      <p class="font-medium text-gray-900 dark:text-white">{{ server.name }}</p>
      <p class="mt-1 text-gray-700 dark:text-gray-300">
        {{ _("Address:") }} <span class="font-mono">{{ server.external_url|linkify }}</span>
      </p>
    </div>
  {% endfor %}
</div>
