{# Each set-up server's address. Expects `servers`. #}
<div class="space-y-4 text-sm" id="server-notes">
  {% for server in servers if server.external_url %}
    <div class="p-4 rounded-xl border border-gray-600 bg-gray-700/40">
      <p class="font-medium text-white">{{ server.name }}</p>
      <p class="mt-1 text-gray-300">
        {{ _("Address:") }} <span class="font-mono break-all">{{ server.external_url|linkify }}</span>
      </p>
    </div>
  {% endfor %}
</div>
